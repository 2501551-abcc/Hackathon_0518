<!DOCTYPE html>
<html lang="ja">
    <head>

        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>おせっかいアプリ</title>
        <link href="style.css" rel="stylesheet" type="text/css">
    </head>
    <body>
        <div class ="container" id="home_container">

                    <span id="task_text">✦達成✦</span><br>
                    <span id="task_count">4</span>

                <div id="favorability_area">
                    <span id="favorability_content">親密Level.</span>
                    <span id="favorability_level">♥1</span>
                </div>
                <div id="side_area">
                    <a href="test.html"><img src="images/icons8-ベル-50.png"></a>
                </div>
            </div>
            <img id="character" src="images/みかちゃん.png" alt="ギャルの女の子のキャラ画像">
            <div id="message_box">
                <p id="name">タスク</p>
                <p id="message">こんにちは！</p>
            </div>
            <div class="menu">
                <a href="home.html"><img src="images/icons8-ホーム-50.png"></a>
                <a href="task_list.html"><img src="images/icons8-タスク-50.png"></a>
                <a href="setting.html"><img src="images/icons8-設定-50.png"></a>
            </div>
        </div>
