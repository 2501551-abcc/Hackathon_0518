<!DOCTYPE html>
<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>おせっかいアプリ</title>
        <link href="style.css" rel="stylesheet" type="text/css">
        <script src="js/seting.js" defer></script>
    </head>
    <body>
        <div class ="container">
            <div class="top_label">
                <span>設定</span>
            </div>
            <form id="input_form">
                <div class="required_setting">
                    <label for="breakfast">朝ご飯：</label>
                    <input type="time" id="breakfast" name="required_content" class="input">
                </div>

                <div class="required_setting">
                    <label for="dinner">夜ご飯：</label>
                    <input type="time" id="dinner" name="required_content" class="input">
                </div>

                <div class="required_setting">
                    <label for="bath">お風呂：</label>
                    <input type="time" id="bath" name="required_content" class="input">
                </div>


                <div class="any_setting">
                    天気：
                    <input id="weather" class="input" type='checkbox' />
                    <label for="weather" class="toggle_label"></label>
                </div>
                <div class="any_setting">
                    忘れ物：
                    <input id="forget" class="input" type='checkbox' />
                    <label for="forget" class="toggle_label"></label>
                </div>
                <button type="submit" id="updateBtn" style="display: none;">更新する</button>

            </form>
            <div class="menu">
                <a href="home.html"><img src="images/icons8-ホーム-50.png"></a>
                <a href="task.html"><img src="images/icons8-タスク-50.png"></a>
                <a href="menu.html"><img src="images/icons8-設定-50.png"></a>
            </div>
        </div>
    </body>
</html>
