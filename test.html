<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <script src="js/task_list.js" defer></script>
        <title>おせっかいアプリ</title>
    </head>
    <body>
        <h3>タスクの通知確認</h3>
        <div class="complete_task">
            <p>完了</p>
        </div>
        <div class="incomplete_task">
            <p>未完了</p>
        </div>
        <form>
            <label>テストしたい項目を選んでください:</label><br>

            <select name="test" id="test_value">
                <option value="breakfast">朝ごはん</option>
                <option value="dinner">夜ご飯</option>
                <option value="bath">お風呂</option>
                <option value="forget">忘れ物</option>
                <option value="weather">天気</option>
            </select>
            <p><button type="button" onclick="task_alerm()">送信</button></p>
        </form>
        <script>
            function task_alerm() {
            if (!("Notification" in window)) {
                alert("このブラウザは通知に対応していません");
                return;
            }

            Notification.requestPermission().then(permission => {
                if (permission === "granted") {
                    let task_content = document.getElementById("test_value").value;

                    let dispName = "タスク";
                    let targetUrl = "task_list.html"; // デフォルトの遷移先

                    if (task_content === 'breakfast' || task_content === "dinner" || task_content === "bath") {
                        if(task_content === 'breakfast') dispName = "朝ごはん";
                        if(task_content === 'dinner') dispName = "夜ご飯";
                        if(task_content === 'bath') dispName = "お風呂";
                        targetUrl = "task_confirm.html"; // 朝昼晩は確認画面へ
                        localStorage.setItem("task_content", dispName);
                    } else if (task_content === "weather") {
                        dispName = "天気";
                        localStorage.setItem("weather_task", "true");
                    } else if (task_content === "forget") {
                        dispName = "忘れ物";
                        localStorage.setItem("forget_task", "true");
                    }

                    //サービスワーカー
                    navigator.serviceWorker.ready.then((registration) => {
                        //↓で通知の文章を表示しています。
                        //天気の具合で文章を変えたい場合は、それようのコードをここら辺に貼ってもらって判定する感じになるかも



                        registration.showNotification("アプリからのメッセージ", {
                            body: task_content === "forget" ? "忘れ物ない？気を付けてね！" : dispName + "の時間だよ！",
                            icon: "images/icon192.png",
                            data: {
                                url: targetUrl 
                            }
                        });
                    });

                } else if (permission === "denied") {
                    alert("通知がブロックされています。");
                }
            });
        }
                    
        </script>
    </body>
</html>
