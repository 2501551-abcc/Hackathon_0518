<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <title>おせっかいアプリ</title>
        <script src="js/task_confirm.js" defer></script>
    </head>
    <body>
        <h3>タスクの通知確認</h3>
        <div class="complete_task">
            <p>完了</p>
        </div>
        <div class="incomplete_task">
            <p>未完了</p>
        </div>
        <form>
            <label>テストしたい項目を選んでください:</label>

            <select name="test" id="test_value">
                <option value="breakfast">朝ごはん</option>
                <option value="dinner">夜ご飯</option>
                <option value="bath">お風呂</option>
                <option value="forget">忘れ物</option>
                <option value="weather">天気</option>
            </select>
            <button type="submit">送信</button>
        </form>

    </body>
</html>
