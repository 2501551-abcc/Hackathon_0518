<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
        <script src="js/task_list.js" defer></script>
        <title>おせっかいアプリ</title>
    </head>
    <body>
        <h3>タスクの通知確認</h3>
        <div class="complete_task">
            <p>完了</p>
        </div>
        <div class="incomplete_task">
            <p>未完了</p>
        </div>
        <form>
            <label>テストしたい項目を選んでください:</label><br>

            <select name="test" id="test_value">
                <option value="breakfast">朝ごはん</option>
                <option value="dinner">夜ご飯</option>
                <option value="bath">お風呂</option>
                <option value="forget">忘れ物</option>
                <option value="weather">天気</option>
            </select>
            <p><button type="button" onclick="task_alerm()">送信</button></p>
        </form>
        <script>
            function task_alerm(){
                if (!("Notification" in window)) {
                    alert("このブラウザは通知に対応していません");
                    return;
                }

                Notification.requestPermission().then(permission => {
                    if (permission === "granted") {
                        let task_content = document.getElementById("test_value").value;

                        if(task_content == '朝ごはん' || task_content == "夜ご飯" || task_content == "お風呂"){
                            let notification = new Notification("アプリからのメッセージ", {
                                body: task_content + "の時間だよ！",
                                icon: "https://via.placeholder.com/128" // 通知に表示するアイコンの画像URL
                            });

                            notification.onclick = function(event) {
                                event.preventDefault();

                                localStorage.clear("task_content");                            
                                localStorage.setItem("task_content", task_content);
                                
                                window.location.href = "task_confirm.html"; 
                                
                                notification.close();
                            };
                        }else if(task_content == "天気"){
                            /*ここ天気の処理(今の天気を通知する？などあれば）*/

                            let notification = new Notification("アプリからのメッセージ", {
                                body: task_content + "の時間だよ！",
                                icon: "https://via.placeholder.com/128" // 通知に表示するアイコンの画像URL
                            });

                            notification.onclick = function(event) {
                                event.preventDefault();

                                localStorage.clear("weather_task");                            
                                localStorage.setItem("weather_task", "true");
                                
                                window.location.href = "task_list.html"; 
                                
                                notification.close();
                            };
                        }else if(task_content == "忘れ物"){
                            let notification = new Notification("アプリからのメッセージ", {
                                body: task_content + "ない？気を付けてね！",
                                icon: "https://via.placeholder.com/128" // 通知に表示するアイコンの画像URL
                            });

                            notification.onclick = function(event) {
                                event.preventDefault();

                                localStorage.clear("forget_task");                            
                                localStorage.setItem("forget_task", "true");
                                
                                window.location.href = "task_list.html"; 
                                
                                notification.close();
                            };
                        }                
                    } else if (permission === "denied") {
                        alert("通知がブロックされています。ブラウザの設定から許可してください。");
                    }
                });
            }
        </script>
    </body>
</html>
